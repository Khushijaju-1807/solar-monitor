<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — SolarLedger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark"><span></span><span></span><span></span><span></span></span>
      SolarLedger
    </a>
  </div>
</nav>

<section class="auth-section">
  <div class="auth-card">
    <span class="eyebrow" style="margin-bottom:8px;">Get started</span>
    <h1>Create your account</h1>
    <p class="auth-sub">Set up SolarLedger for your plant in a couple of minutes.</p>

    <form id="registerForm" class="auth-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Jane Doe">
      </div>

      <div class="form-group">
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" name="email" placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" name="password" placeholder="••••••••">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••">
      </div>

      <p class="form-error" id="registerError"></p>

      <button type="submit" class="btn-primary auth-submit">Create Account</button>
    </form>

    <div class="auth-footer">
      <span>Already have an account? <a href="login.html">Log In</a></span>
    </div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
